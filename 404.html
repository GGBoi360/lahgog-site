<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>לחגוג</title>
    <meta name="theme-color" content="#E84A2F" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!--
      GitHub Pages serves this page for any path without a file. Every link the app shares is a real file now
      (invite.js, guest.js); this page only forwards the older path forms that app versions before 2026-10-26 shared
      (/j/<code>, /i/<code>, /f/<code> to /j/?c=<code>; /p/<token>, /g/<token> to /p/?t=<token>). Anything else is
      "not found".
    -->
    <main>
      <h1 class="brand"><a href="/">לחגוג</a></h1>
      <section class="card" id="missing" hidden>
        <h2>הדף לא נמצא</h2>
        <p>אולי הקישור נקטע בדרך.</p>
        <a class="button secondary" href="/">לדף הבית</a>
      </section>
    </main>
    <footer>לחגוג · <a href="/privacy">פרטיות</a> · <a href="/terms">תנאי שימוש</a> · <a href="/delete-account">מחיקת חשבון</a> · <a href="/accessibility">הצהרת נגישות</a></footer>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var code = /^\/(j|i|f)\/([A-Za-z0-9]{8})$/.exec(path);
        if (code) return location.replace('/' + code[1] + '/?c=' + code[2]);
        var guest = /^\/(p|g)\/([A-Za-z0-9]{24})$/.exec(path);
        if (guest) return location.replace('/' + guest[1] + '/?t=' + guest[2]);
        document.getElementById('missing').hidden = false;
      })();
    </script>
  </body>
</html>
